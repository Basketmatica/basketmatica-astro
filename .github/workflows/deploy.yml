name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reconstruye cada día a las 08:00 UTC: publica los artículos programados (pubDate futura,
  # ver isPublished) y rota la "Métrica de la semana". Los cron de GitHub Actions van en UTC y
  # pueden retrasarse unos minutos.
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez, y nunca se cancela uno en curso (lo recomendado para Pages).
# Los pull requests (p. ej. los de Dependabot) tienen su propio grupo por rama: si compartieran el
# de producción, sus validaciones cancelarían los despliegues.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Comprobar enlaces internos
        run: npm run check:links

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Los pull requests solo validan (tipos, build y enlaces); no despliegan.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
