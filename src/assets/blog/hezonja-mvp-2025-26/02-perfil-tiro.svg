<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perfil de tiro de Hezonja: 36,6% en triples, 55,6% en tiros de dos y 89,5% en tiros libres, con su ranking en la Liga y una estimacion de eFG y TS.">
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:'Courier New',ui-monospace,monospace}
    .sans{font-family:'Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1000" height="600" fill="#F5F0E5"/>

  <text class="mono" x="90" y="66" font-size="15" letter-spacing="3" fill="#7A7064">LIGA ENDESA 2025-26 · PERFIL DE TIRO</text>
  <text class="serif" x="90" y="116" font-size="40" fill="#2A2622">Un tirador de tres niveles</text>
  <rect x="92" y="134" width="64" height="3" fill="#C05A37"/>

  <!-- row 1: triple -->
  <text class="serif" x="90" y="225" font-size="22" fill="#2A2622">Triple</text>
  <text class="mono" x="90" y="248" font-size="13" fill="#7A7064">8º · 2,1 triples/p</text>
  <rect x="300" y="210" width="520" height="40" fill="#E7DECB"/>
  <rect x="300" y="210" width="190" height="40" fill="#3F6B4A"/>
  <text class="mono" x="950" y="237" font-size="24" text-anchor="end" fill="#3F6B4A">36,6%</text>

  <!-- row 2: tiro de 2 -->
  <text class="serif" x="90" y="305" font-size="22" fill="#2A2622">Tiro de 2</text>
  <text class="mono" x="90" y="328" font-size="13" fill="#7A7064">15º · 3,5 dobles/p</text>
  <rect x="300" y="290" width="520" height="40" fill="#E7DECB"/>
  <rect x="300" y="290" width="289" height="40" fill="#3F6B4A"/>
  <text class="mono" x="950" y="317" font-size="24" text-anchor="end" fill="#3F6B4A">55,6%</text>

  <!-- row 3: tiro libre -->
  <text class="serif" x="90" y="385" font-size="22" fill="#2A2622">Tiro libre</text>
  <text class="mono" x="90" y="408" font-size="13" fill="#7A7064">9º mejor % · 4 TL/p</text>
  <rect x="300" y="370" width="520" height="40" fill="#E7DECB"/>
  <rect x="300" y="370" width="465" height="40" fill="#3F6B4A"/>
  <text class="mono" x="950" y="397" font-size="24" text-anchor="end" fill="#3F6B4A">89,5%</text>

  <!-- estimate card -->
  <rect x="90" y="458" width="860" height="64" rx="4" fill="none" stroke="#C05A37" stroke-width="1.5"/>
  <text class="mono" x="112" y="488" font-size="20" fill="#C05A37">eFG% ≈ 55 · TS% ≈ 63</text>
  <text class="sans" x="112" y="510" font-size="13" fill="#7A7064">Estimación propia a partir de los promedios públicos. No es un dato oficial: reconstruye intentos desde aciertos y porcentajes.</text>

  <line x1="90" y1="558" x2="950" y2="558" stroke="#DCD3C2" stroke-width="1"/>
  <text class="serif" x="90" y="582" font-size="15" font-style="italic" fill="#7A7064">Tres niveles de tiro a buen porcentaje: versatilidad, no especialización.</text>
  <text class="mono" x="950" y="582" font-size="14" text-anchor="end" fill="#C05A37">@basketmatica</text>
</svg>
