  <text class="mono" x="804" y="546" font-size="15" fill="#C05A37">31º</text>

  <!-- axis -->
  <line x1="340" y1="585" x2="920" y2="585" stroke="#C9BFAC" stroke-width="1.5"/>
  <line x1="340" y1="582" x2="340" y2="590" stroke="#C9BFAC"/>
  <line x1="474" y1="582" x2="474" y2="590" stroke="#C9BFAC"/>
  <line x1="623" y1="582" x2="623" y2="590" stroke="#C9BFAC"/>
  <line x1="771" y1="582" x2="771" y2="590" stroke="#C9BFAC"/>
  <line x1="920" y1="582" x2="920" y2="590" stroke="#C9BFAC"/>
  <text class="mono" x="340" y="606" font-size="12" text-anchor="middle" fill="#9A8F7E">1</text>
