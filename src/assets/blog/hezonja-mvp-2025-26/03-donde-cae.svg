<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Posiciones de Hezonja en los rankings de la Liga Endesa: 3o en puntos, 8o en triples y rebote defensivo, 10o en tiros libres, 12o en mas-menos, 15o en tiros de dos, 18o en minutos y 31o en recuperaciones.">
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:'Courier New',ui-monospace,monospace}
    .sans{font-family:'Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1000" height="680" fill="#F5F0E5"/>

  <text class="mono" x="90" y="66" font-size="15" letter-spacing="3" fill="#7A7064">LIGA ENDESA 2025-26 · POSICIÓN EN LOS RANKINGS</text>
  <text class="serif" x="90" y="116" font-size="40" fill="#2A2622">Dónde cae</text>
  <rect x="92" y="134" width="64" height="3" fill="#C05A37"/>

  <!-- legend -->
