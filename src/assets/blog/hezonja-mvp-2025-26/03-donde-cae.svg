  <text class="sans" x="920" y="624" font-size="12" text-anchor="end" fill="#9A8F7E">peor puesto →</text>

  <line x1="90" y1="644" x2="920" y2="644" stroke="#DCD3C2" stroke-width="1"/>
  <text class="serif" x="90" y="668" font-size="15" font-style="italic" fill="#7A7064">Arriba en producción y eficiencia; abajo en minutos y robos.</text>
  <text class="mono" x="920" y="668" font-size="14" text-anchor="end" fill="#C05A37">@basketmatica</text>
</svg>
