<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barras de la valoracion PIR de Mario Hezonja por temporada: 10,6 en 2022-23, 11,2 en 2023-24, 14,1 en 2024-25 y 18,8 en 2025-26.">
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:'Courier New',ui-monospace,monospace}
    .sans{font-family:'Helvetica Neue',Arial,sans-serif}
  </style>
  <rect width="1000" height="640" fill="#F5F0E5"/>

  <text class="mono" x="90" y="66" font-size="15" letter-spacing="3" fill="#7A7064">LIGA ENDESA · VALORACIÓN (PIR) POR TEMPORADA</text>
  <text class="serif" x="90" y="116" font-size="40" fill="#2A2622">La cima de una curva de cuatro años</text>
  <rect x="92" y="134" width="64" height="3" fill="#C05A37"/>

  <line x1="90" y1="540" x2="940" y2="540" stroke="#C9BFAC" stroke-width="1.5"/>

  <!-- bar 1: 10.6 -->
  <rect x="136" y="365" width="120" height="175" fill="#3F6B4A"/>
  <text class="mono" x="196" y="350" font-size="26" text-anchor="middle" fill="#3F6B4A">10,6</text>
  <text class="sans" x="196" y="566" font-size="16" text-anchor="middle" fill="#7A7064">2022-23</text>

  <!-- bar 2: 11.2 -->
  <rect x="349" y="355" width="120" height="185" fill="#3F6B4A"/>
  <text class="mono" x="409" y="340" font-size="26" text-anchor="middle" fill="#3F6B4A">11,2</text>
  <text class="sans" x="409" y="566" font-size="16" text-anchor="middle" fill="#7A7064">2023-24</text>

  <!-- bar 3: 14.1 -->
  <rect x="561" y="307" width="120" height="233" fill="#3F6B4A"/>
  <text class="mono" x="621" y="292" font-size="26" text-anchor="middle" fill="#3F6B4A">14,1</text>
  <text class="sans" x="621" y="566" font-size="16" text-anchor="middle" fill="#7A7064">2024-25</text>

  <!-- bar 4: 18.8 (MVP) -->
  <rect x="774" y="230" width="120" height="310" fill="#C05A37"/>
  <text class="mono" x="834" y="215" font-size="30" text-anchor="middle" fill="#C05A37">18,8</text>
  <text class="sans" x="834" y="566" font-size="16" text-anchor="middle" fill="#2A2622">2025-26</text>
  <rect x="800" y="246" width="68" height="22" rx="3" fill="#F5F0E5" stroke="#C05A37" stroke-width="1.2"/>
  <text class="mono" x="834" y="261" font-size="12" letter-spacing="2" text-anchor="middle" fill="#C05A37">MVP</text>

  <!-- jump deltas -->
  <text class="mono" x="302" y="338" font-size="15" text-anchor="middle" fill="#9A8F7E">+0,6</text>
  <text class="mono" x="515" y="318" font-size="15" text-anchor="middle" fill="#C05A37">+2,9</text>
  <text class="mono" x="727" y="248" font-size="17" text-anchor="middle" fill="#C05A37">+4,7</text>

  <line x1="90" y1="598" x2="940" y2="598" stroke="#DCD3C2" stroke-width="1"/>
  <text class="serif" x="90" y="622" font-size="15" font-style="italic" fill="#7A7064">Cada salto interanual supera al anterior; el mayor coincide con el MVP.</text>
  <text class="mono" x="940" y="622" font-size="14" text-anchor="end" fill="#C05A37">@basketmatica</text>
</svg>
